name: classroom-monitoring-local

# 개발자 PC(local)의 메인 스택. **서버용은 compose.main.dev.yml이다.**
#
# 실행 (저장소 루트에서):
#   docker compose -f .docker/compose.main.local.yml up -d
#   docker compose -f .docker/compose.main.local.yml up -d --build fastapi   # 소스 반영
#   docker compose -f .docker/compose.main.local.yml --profile worker up -d  # GPU 있을 때
#
# **--env-file을 주지 않는다**(결정 0018). 이 파일이 커밋되므로 실행에 필요한 값을
# 파일 안에 직접 적었다. 비밀값만 env_file로 주입하고 그 파일들은 커밋하지 않는다
# (.docker/env/*.env는 .gitignore 대상, 변수 목록은 각 서비스의 .env.example).
#
# **dev와 다른 점은 넷이다.**
# 1. 이미지를 여기서 빌드한다(:local 태그). GHCR에서 받지 않는다.
# 2. 앞단에 nginx가 없다. 그래서 브라우저가 각 포트에 직접 붙고, n8n은 경로 접두사가
#    없으며(N8N_PATH=/), WebRTC 시그널링도 MediaMTX 포트로 직접 간다.
# 3. inference-worker는 GPU를 요구하므로 기본으로 뜨지 않는다(profiles).
# 4. 운영자 도구(MinIO 콘솔)를 그냥 연다. 개발자 PC라 SSH 터널을 팔 이유가 없다.
#
# 호스트 포트는 **dev와 같은 번호를 쓴다.** 환경마다 주소가 달라지면 헷갈리기 때문이고,
# 로컬에서도 4자리 기본값을 피해 다른 프로그램과 부딪히지 않게 한다.
# 모두 127.0.0.1에 묶여 있어 같은 망의 다른 PC에서는 보이지 않는다.

networks:
  backend:
    name: classroom-monitoring-local-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  minio-data:
  n8n-data:

services:
  fastapi:
    # **로컬에서 직접 빌드한다.** 소스를 고치고 바로 확인하려는 것이 로컬 스택의 목적이다.
    # 태그를 :local로 둬서 GHCR의 :latest를 덮어쓰지 않는다.
    build:
      context: ../webapps/fastapi
    image: classroom-monitoring-fastapi:local
    env_file:
      - ./env/fastapi.local.env
    environment:
      APP_ENV: local
    # 브라우저가 여기로 직접 붙는다: http://localhost:8076
    ports:
      - "127.0.0.1:8076:8001"
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  # 얼굴 분석 내부 서비스. **기본으로 뜨지 않는다** — 가중치 346MB를
  # .docker/models/face에 미리 두어야 하고, 쓰지 않으면 fastapi가
  # FACE_ANALYZER_MODE=synthetic으로 도는 데 지장이 없기 때문이다.
  #   docker compose -f .docker/compose.main.local.yml --profile face up -d
  # 띄운 뒤에는 env/fastapi.local.env의 FACE_ANALYZER_MODE를 http로 바꾼다.
  deeplearning:
    profiles: ["face"]
    build:
      context: ../deeplearning
    image: classroom-monitoring-deeplearning:local
    environment:
      FACE_DETECTION_MODEL_PATH: /models/face/scrfd/scrfd_10g_bnkps.onnx
      FACE_LANDMARKER_MODEL_PATH: /models/face/mediapipe/face_landmarker.task
      FACE_RECOGNITION_MODEL_PATH: /models/face/buffalo_l/w600k_r50.onnx
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  # **기본으로 뜨지 않는다.** GPU가 있는 PC에서만 `--profile worker`로 띄운다.
  # GPU 없이 올리면 컨테이너가 device 예약을 못 받아 기동에 실패한다.
  inference-worker:
    profiles: ["worker"]
    build:
      context: ../worker
    image: classroom-monitoring-worker:local
    env_file:
      - ./env/worker.local.env
    environment:
      APP_ENV: local
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *default-logging
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    environment:
      # 브라우저와 MediaMTX가 같은 PC에 있으므로 localhost로 충분하다.
      MTX_WEBRTCADDITIONALHOSTS: localhost
      MTX_WEBRTCIPSFROMINTERFACES: "no"
      # dev와 같은 번호를 쓴다. ports의 두 줄과 반드시 같아야 한다.
      MTX_WEBRTCLOCALUDPADDRESS: ":18189"
      MTX_WEBRTCLOCALTCPADDRESS: ":18189"
    ports:
      # **WHEP 시그널링(8889)은 호스트에 열지 않는다.** fastapi가 프록시하므로
      # (WHEP_BASE_URL=http://mediamtx:8889) 브라우저는 fastapi에만 붙는다(결정 0014).
      # 로컬도 서버와 같은 경로를 타므로 앞단 proxy 없이 실시간 영상이 확인된다.
      - "18189:18189/udp"
      - "18189:18189/tcp"
      # HLS와 RTSP는 로컬에서 열어 둔다. ffmpeg로 합성 스트림을 밀어 넣고 확인할 때 쓴다.
      - "127.0.0.1:18888:8888" # HLS
      - "127.0.0.1:18554:8554" # RTSP publish
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file:
      - ./env/minio.local.env
    ports:
      - "127.0.0.1:19000:9000" # S3 API
      - "127.0.0.1:19001:9001" # 콘솔. 로컬에서는 그냥 연다
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file:
      - ./env/minio.local.env
    environment:
      SNAPSHOT_BUCKET: classroom-snapshots
      SNAPSHOT_RETENTION_DAYS: "30"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export MC_HOST_local="http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@minio:9000"
        mc ready local
        mc mb --ignore-existing "local/$${SNAPSHOT_BUCKET}"
        mc ilm rule add --expire-days "$${SNAPSHOT_RETENTION_DAYS}" "local/$${SNAPSHOT_BUCKET}" 2>/dev/null \
          || echo "보존 규칙이 이미 있다"
        mc ilm rule ls "local/$${SNAPSHOT_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging
    restart: "no"

  n8n:
    image: n8nio/n8n:2.33.5
    env_file:
      - ./env/n8n.local.env
    environment:
      # **접두사가 없다.** 경로를 나눠 줄 nginx가 로컬에는 없어서 포트로 직접 붙는다.
      N8N_PATH: /
      N8N_EDITOR_BASE_URL: http://localhost:15678/
      WEBHOOK_URL: http://localhost:15678/
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:15678:5678"
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped
