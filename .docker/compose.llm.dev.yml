name: classroom-monitoring-dev-llm

# 공용 GPU 서버(dev)의 LLM 스택. **로컬용은 compose.llm.local.yml이다.**
#
# 실행 (저장소 루트에서, compose.main.dev.gpu.yml을 먼저 올린 뒤):
#   docker compose -f .docker/compose.llm.dev.yml up -d
#
# 메인 스택과 따로 둔 이유는 GPU 메모리를 많이 쓰는 쪽을 독립적으로 내렸다 올리기
# 위해서다. network는 메인 스택이 만든 것을 그대로 쓴다.

networks:
  backend:
    name: classroom-monitoring-dev-backend
    external: true

services:
  llama-server:
    # server-cuda-b10362 == server-cuda 태그와 digest 동일
    # (sha256:182a26fbd68d1774860bd2a0fb5581ba3047974307eaeee64930d8bf889e0c0c).
    # 이미지의 ENTRYPOINT가 /app/llama-server라 command에는 인자만 넣는다.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10362
    # 가중치는 호스트에 두고 읽기 전용으로 마운트한다. 컨테이너가 외부에서 모델을
    # 받아오지 않게 해서 재현 가능한 상태로 둔다.
    # **.docker/models/는 .gitignore 대상이다** — 가중치는 저장소에 넣지 않는다.
    volumes:
      - ./models:/models:ro
    environment:
      # llama-server는 LLAMA_ARG_* 환경변수를 CLI 인자와 같게 취급한다.
      # 이미지에 LLAMA_ARG_HOST=0.0.0.0이 이미 들어 있다.
      #
      # **파일명을 고정하고 받은 가중치를 이 이름으로 둔다.** 모델을 바꿀 때마다
      # compose를 고치면 서버와 저장소가 어긋나고, 누가 어떤 파일로 돌렸는지
      # 알 수 없게 된다. 어떤 모델을 이 이름으로 두었는지는 .docker/README.server.md에
      # 적는다.
      LLAMA_ARG_MODEL: /models/gemma.gguf
      LLAMA_ARG_PORT: "8008"
      LLAMA_ARG_ALIAS: gemma
      # 전 레이어를 GPU에 올린다. VRAM이 모자라면 이 값을 낮춘다.
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_CTX_SIZE: "4096"
    # **Tailscale 주소에만 연다.** 전에는 아무것도 열지 않았다 — fastapi가 같은
    # network 안에 있어서 llama-server:8008로 불렀기 때문이다. 결정 0026으로
    # fastapi가 개인 PC로 가면서 이 호출이 호스트 경계를 넘는다.
    #
    # **0.0.0.0에 열면 안 된다.** 이 서버는 공인 IP를 가진 공용 장비이고,
    # llama-server에는 인증이 없어서 열면 누구나 GPU를 쓰는 추론 엔드포인트가 된다.
    ports:
      - "100.85.0.72:18008:8008"
    networks:
      - backend
    # 모델 로딩에 수십 초가 걸린다. 그 사이에 들어온 첫 질문은 실패하는데, 사용자
    # 눈에는 기능 고장으로 보인다. 상태를 밖에서 확인할 수 있어야 "아직 뜨는 중"과
    # "안 뜬다"를 구분한다.
    #
    # **이미지에 curl이 없으면 healthcheck가 영영 unhealthy로 남는다.** 첫 기동에서
    # `docker compose ps`로 healthy가 되는지 반드시 확인한다 — 안 되면 이 블록을
    # 지우는 쪽이 낫다. restart 정책과 엮이지 않으므로 unhealthy여도 서비스는 돈다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # inference-worker(compose.main.dev.gpu.yml)도 같은 1번을 쓴다 —
              # 46GB를 두 서비스가 나눠 쓰는 구조다.
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped
