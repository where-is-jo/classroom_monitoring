name: classroom-monitoring-dev-llm

# 공용 GPU 서버(dev)의 LLM 스택. **로컬용은 compose.llm.local.yml이다.**
#
# 실행 (저장소 루트에서, compose.main.dev.yml을 먼저 올린 뒤):
#   docker compose -f .docker/compose.llm.dev.yml up -d
#
# 메인 스택과 따로 둔 이유는 GPU 메모리를 많이 쓰는 쪽을 독립적으로 내렸다 올리기
# 위해서다. network는 메인 스택이 만든 것을 그대로 쓴다.

networks:
  backend:
    name: classroom-monitoring-dev-backend
    external: true

services:
  llama-server:
    # server-cuda-b10362 == server-cuda 태그와 digest 동일
    # (sha256:182a26fbd68d1774860bd2a0fb5581ba3047974307eaeee64930d8bf889e0c0c).
    # 이미지의 ENTRYPOINT가 /app/llama-server라 command에는 인자만 넣는다.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10362
    # 가중치는 호스트에 두고 읽기 전용으로 마운트한다. 컨테이너가 외부에서 모델을
    # 받아오지 않게 해서 재현 가능한 상태로 둔다.
    # **.docker/models/는 .gitignore 대상이다** — 가중치는 저장소에 넣지 않는다.
    volumes:
      - ./models:/models:ro
    environment:
      # llama-server는 LLAMA_ARG_* 환경변수를 CLI 인자와 같게 취급한다.
      # 이미지에 LLAMA_ARG_HOST=0.0.0.0이 이미 들어 있다.
      # TODO: 어떤 크기·양자화를 쓸지 정해지면 파일명을 확정한다(지금은 placeholder).
      LLAMA_ARG_MODEL: /models/gemma.gguf
      LLAMA_ARG_PORT: "8008"
      LLAMA_ARG_ALIAS: gemma
      # 전 레이어를 GPU에 올린다. VRAM이 모자라면 이 값을 낮춘다.
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_CTX_SIZE: "4096"
    # 호스트에 포트를 열지 않는다. 같은 network의 n8n·fastapi가
    # llama-server:8008로 부른다(LLM_SEARCH_URL).
    networks:
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # inference-worker(compose.main.dev.yml)도 같은 1번을 쓴다 —
              # 46GB를 두 서비스가 나눠 쓰는 구조다.
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped
