name: classroom-monitoring-local-observability

# 개발자 PC(local)의 모니터링 스택. **서버용은 compose.monitoring.dev.yml이다.**
#
# 실행 (저장소 루트에서, compose.main.local.yml을 먼저 올린 뒤):
#   docker compose -f .docker/compose.monitoring.local.yml up -d
#
# **평소 로컬 작업에는 필요 없다.** 대시보드나 로그 수집 자체를 손볼 때만 올린다.
#
# **dev와 다른 점은 둘이다.**
# 1. Grafana·Prometheus·Loki·Alloy UI를 호스트에 연다. 개발자 PC라 SSH 터널을 팔
#    이유가 없다.
# 2. Alloy가 로컬 project label이 붙은 설정을 읽는다(config.local.alloy).
#
# 지금 Prometheus는 자기 자신만 스크랩한다. 어떤 서비스도 /metrics를 노출하지 않는다
# (monitoring/internal/README.md "구현 전").

networks:
  backend:
    name: classroom-monitoring-local-backend
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    env_file:
      - ./env/grafana.local.env
    volumes:
      - grafana-data:/var/lib/grafana
      # 데이터소스·대시보드 정의는 monitoring/internal이 관리한다(그 README의 책임).
      - ../monitoring/internal/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/internal/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - backend
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:13100:3100"
    networks:
      - backend
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      # 로컬 스택은 project label이 달라 설정 파일을 따로 둔다.
      - ./alloy/config.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345" # Alloy UI(파이프라인 상태 확인)
    networks:
      - backend
    depends_on:
      - loki
    restart: unless-stopped
