name: classroom-monitoring-dev-pc

# 개인 PC(노트북)의 메인 스택. **GPU 서버용은 compose.main.dev.gpu.yml이다.**
#
# 실행 (저장소 루트에서):
#   docker compose -f .docker/compose.main.dev.pc.yml pull
#   docker compose -f .docker/compose.main.dev.pc.yml up -d
#   docker compose -f .docker/compose.main.dev.pc.yml config    # 문법 검증
#
# **이 파일은 compose.main.dev.yml을 호스트 축으로 쪼갠 나머지 절반이다**
# (결정 0026의 4번). GPU가 필요 없는 둘만 여기 있다.
#
# | 여기(개인 PC) | 저기(GPU 서버, compose.main.dev.gpu.yml) |
# | --- | --- |
# | fastapi, n8n | deeplearning, inference-worker, mediamtx, minio |
#
# **이것은 개발·검증용이며 운영 배포가 아니다**(결정 0026의 5번).
# 개인 PC는 운영 환경이 될 수 없고, APP_ENV=prod 배포는 계속 금지다(결정 0010).
#
# **--env-file을 주지 않는다**(결정 0018). 이 파일이 커밋되므로 실행에 필요한 값을
# 파일 안에 직접 적었다. 비밀값만 env_file로 주입하고 그 파일들은 커밋하지 않는다.
#
# **컨테이너로 띄우는 스택은 이제 dev뿐이다**(결정 0034). 개발자 PC 한 대에서 전부
# 돌리던 compose.main.local.yml은 없앴다 — 백엔드가 노트북으로 오면서 그 스택과 이
# 파일이 같은 기계·같은 포트를 다투게 됐기 때문이다.
#
# **소스를 고쳐 가며 볼 때는 컨테이너를 쓰지 않는다.** webapps/fastapi에서 직접 띄운다:
#   cp .env.example .env.local && python -m uvicorn app.main:app --reload --port 8000
# --reload가 붙어 이쪽이 더 빠르다. 이 파일은 CI가 만든 이미지를 받아 도는 쪽이다.

networks:
  backend:
    # **GPU 서버의 network(classroom-monitoring-dev-backend)와 이름이 다르다.**
    # 다른 기계의 bridge network라 이어 붙일 수 없다 — 호스트를 넘는 호출은
    # 전부 Tailscale 주소를 쓴다. 여기 network는 fastapi <-> n8n 사이에만 쓰인다.
    name: classroom-monitoring-dev-pc-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  n8n-data:

# 포트 방침
#
# **두 주소에 묶는다.** 127.0.0.1은 이 노트북의 브라우저용이고, Tailscale 주소는
# GPU 서버에서 넘어오는 것용이다. 결정 0026의 3번 표에서 "GPU 서버 -> 개인 PC"
# 방향이 둘 있다.
#
#   1. inference-worker -> fastapi 탐지 이벤트 (env/worker.dev.env의 FASTAPI_URL)
#   2. prometheus -> fastapi 지표 (.docker/prometheus/prometheus.dev.yml)
#
# **0.0.0.0에 묶지 않는다.** 이 노트북은 강의실 CCTV와 같은 192.168.0.x 사설망에
# 있어서, 0.0.0.0은 그 망의 모든 기기에 화면과 API를 여는 것이 된다. 앱에 인증이
# 없으므로(결정 0030) 그만큼 그대로 노출된다.
#
# | 호스트 | -> 컨테이너 | 누가 부르나 |
# | --- | --- | --- |
# | 127.0.0.1:8076 | fastapi:8001 | 이 노트북의 브라우저 |
# | 100.119.241.93:8076 | fastapi:8001 | GPU 서버의 worker·prometheus, 팀원 브라우저 |
# | 127.0.0.1:15678 | n8n:5678 | 이 노트북의 브라우저 |
# | 100.119.241.93:15678 | n8n:5678 | 팀원 브라우저 |
#
# **Tailscale이 내려가 있으면 이 스택은 기동에 실패한다.** 없는 주소에는 bind할 수
# 없기 때문이다. 결정 0026이 적어 둔 "Tailscale이 단일 실패 지점이 된다"가 여기서
# 가장 먼저 드러난다.
#   확인: tailscale status
#
# **노트북의 Tailscale 주소가 바뀌면 이 파일과 아래 넷을 함께 고쳐야 한다.**
#   - env/worker.dev.env의 FASTAPI_URL          (GPU 서버)
#   - prometheus/prometheus.dev.yml의 fastapi target (GPU 서버)
#   - 아래 n8n의 N8N_EDITOR_BASE_URL·WEBHOOK_URL
# 주소는 tailnet 노드에 고정되므로 기기를 바꾸지 않는 한 바뀌지 않는다.

services:
  fastapi:
    # **build 블록을 두지 않는다.** dev 스택은 CI가 만든 이미지를 받아서 돈다.
    # 소스를 고쳐 가며 볼 때는 위 주석의 직접 구동을 쓴다.
    #
    # **:latest가 아니라 :develop을 본다.** CI는 develop 병합마다 develop과 sha-* 태그로
    # 올리고 latest는 붙이지 않는다(결정 0014). 여기서 latest를 보면 병합해도
    # 갱신되지 않는다. latest는 나중에 main 배포 시점의 태그로 남겨 둔다.
    image: ghcr.io/where-is-jo/classroom-monitoring-fastapi:develop
    env_file:
      # 변수 이름의 기준은 webapps/fastapi/.env.example이다. 환경과 무관한 값은
      # 여기 없다 — 이미지 안의 config/settings.yml이 갖는다.
      #
      # **호스트 분할로 주소 네 개가 Tailscale 기준으로 바뀐다**(결정 0026의 3번).
      #   FACE_ANALYZER_URL        -> http://100.85.0.72:18100
      #   SNAPSHOT_STORAGE_ENDPOINT -> 100.85.0.72:19000
      #   LLM_SEARCH_URL           -> http://100.85.0.72:18008
      #   WHEP_BASE_URL            -> http://100.85.0.72:18889
      # 컨테이너 이름(deeplearning:8100 등)은 이제 닿지 않는다. 다른 기계다.
      - ./env/fastapi.dev.env
    environment:
      # env_file보다 여기 값이 우선한다. 이 파일은 dev 전용이므로 고정한다.
      APP_ENV: dev
      # **카메라 RTSP를 이 노트북이 직접 잡는다**(결정 0031). CCTV가 노트북과 같은
      # 192.168.0.x 사설망에 있어서 호스트 분할 뒤에는 오히려 이쪽이 가깝다.
      # 값은 카메라 계정·비밀번호가 든 비밀값이라 env/fastapi.dev.env에 둔다.
      #
      # **컨테이너에서 사설망 IP로 나갈 수 있어야 한다.** Docker Desktop의 기본
      # bridge는 호스트를 통해 NAT로 나가므로 그대로 닿는다. 안 되면 ROI 화면의
      # 캡처 버튼만 실패하고 나머지 기능은 정상이다.
      #
      # **앞단에 reverse proxy를 두지 않는다.** 인터넷에 공개하지 않는 프로젝트라
      # 경로를 나눌 이유도 TLS를 끝낼 이유도 없다. 붙이게 되면 uvicorn에
      # FORWARDED_ALLOW_IPS를 함께 줘야 한다 — 기본값이 127.0.0.1이라 컨테이너
      # network를 타고 온 X-Forwarded-* 는 그냥 무시된다.
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8076:8001"
      - "100.119.241.93:8076:8001"
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.33.5
    env_file:
      - ./env/n8n.dev.env
    environment:
      # **경로 접두사가 없다.** 앞단에 경로를 나눠 줄 proxy를 두지 않기로 했으므로
      # (인터넷에 공개하지 않는 프로젝트다) 포트로 직접 붙는다. 전에 GPU 서버에
      # 있을 때 쓰던 N8N_PATH=/n8n/ 은 다른 팀 nginx 전제였고, 그 전제가 사라졌다.
      N8N_PATH: /
      # **브라우저가 보는 주소**여야 한다. 편집기가 자기 자산과 리다이렉트, webhook
      # 주소를 이 값으로 만든다. 팀원이 tailnet으로 붙을 수 있게 Tailscale 주소를 쓴다.
      # localhost로 두면 이 노트북에서만 편집기가 정상 동작한다.
      N8N_EDITOR_BASE_URL: http://100.119.241.93:15678/
      WEBHOOK_URL: http://100.119.241.93:15678/
      # **n8n 2.x는 nodes.exclude 기본값이 비어 있지 않다.** @n8n/config의 NodesConfig가
      # executeCommand·localFileTrigger 둘을 기본 제외로 들고 있어서, 아무것도 적지 않으면
      # Execute Command 노드가 편집기에 나타나지 않는다. 서버 로그에는
      # "Unrecognized node type: n8n-nodes-base.executeCommand"로 찍힌다.
      #
      # **워크플로가 사이드카(rpa-runner)를 HTTP로 부르게 바뀌어 Execute Command는 더 이상
      # 필요하지 않다.** 다른 워크플로가 쓰지 않는다면 이 줄을 지워 기본값(둘 다 차단)으로
      # 되돌려도 된다 — 편집기에 붙을 수 있는 사람이면 누구나 이 컨테이너 안에서 셸 명령을
      # 실행할 수 있게 되는 설정이라, 필요가 사라지면 닫는 편이 낫다.
      # **JSON 배열 문자열이어야 한다.** 빈 값이나 콤마 나열은 파싱되지 않는다.
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      # **컨테이너 기본 시계가 UTC라 시간표가 9시간 어긋난다.** 워크플로의 Parse
      # Schedule은 `new Date().setHours(...)`로 공부 시간 구간을 판정하므로, TZ가
      # UTC면 오전 10시(KST)를 01시로 보고 어느 구간에도 들지 않는다. 실측으로
      # 확인했다 — 컨테이너 시각이 `Tue Aug 25 2026 01:50 GMT+0000`이었다.
      # GENERIC_TIMEZONE은 스케줄 트리거가, TZ는 Node의 시계가 쓴다. 둘 다 준다.
      TZ: Asia/Seoul
      GENERIC_TIMEZONE: Asia/Seoul
      # **기본값이 차단이라 워크플로의 $env가 전부 실패한다.** 확인 결과 Code 노드에서
      # `ExpressionError: access to env vars denied`가 났다. 아래 값들을 워크플로가
      # $env로 읽으므로 열어 준다. 이 n8n은 인터넷에 공개하지 않고 tailnet 안에만
      # 있으며, 여기 담기는 값은 강의실 id와 내부 주소로 비밀값이 아니다.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # **파일 노드는 기본으로 모든 경로가 막혀 있다.** 시간표를 읽으려다
      # `Access to the file is not allowed.`로 실패한다. 읽어야 하는 디렉터리만
      # 허용 목록에 넣는다 — 저장소 전체도, RPA 디렉터리 전체도 열지 않는다.
      # (RPA 루트를 열면 Slack 토큰이 든 .env까지 편집기에서 읽을 수 있다.)
      N8N_RESTRICT_FILE_ACCESS_TO: /repo/RPAs/study-status-report/schedule
      # **기본값(filesystem)에서는 Code 노드가 파일 내용을 볼 수 없다.** 항목에는
      # 13바이트짜리 참조만 실려 오고 실제 내용은 디스크에 남아, 시간표를 읽어도
      # 파싱할 것이 없다. 여기서 다루는 바이너리는 시간표 문서 한 개(1.5KB)뿐이라
      # 메모리에 담아도 부담이 없다.
      N8N_DEFAULT_BINARY_DATA_MODE: default
      # --- study-status-report 워크플로가 $env로 읽는 값 ---
      # 비밀값이 아니라 어느 강의실을 보는지의 문제라 결정 0018대로 여기 직접 적는다.
      # 대상 강의실을 바꾸려면 이 두 값을 고친다(fastapi의 강의실 목록 id·이름).
      CLASSROOM_ID: f5a51e8e-2fe6-4056-b6d5-84a6a9804dbb
      CLASSROOM_NAME: 4A 강의실
      # 컨테이너끼리는 같은 network 안에서 서비스 이름으로 부른다. 호스트 포트(8076)를
      # 쓰면 Tailscale이 내려갈 때 같이 끊긴다.
      FASTAPI_BASE_URL: http://fastapi:8001
      # **시간표 문서는 저장소가 관리한다.** RPA 디렉터리 안에 있어 다른 호스트에
      # 배포해도 따라온다. 읽지 못하면 Slack에 알리고 기록을 중단한다
      # (RPA README의 실패 조건).
      SCHEDULE_FILE_PATH: /repo/RPAs/study-status-report/schedule/시간표.md
      # 파이썬 스크립트를 대신 실행하는 사이드카. 아래 rpa-runner 서비스다.
      RPA_RUNNER_URL: http://rpa-runner:8099
      # **교시 종료 보고를 늦게라도 따라잡는 창.** 교시가 끝난 뒤 이 시간 안이면
      # 밀린 보고서도 올린다. 예전에는 창이 트리거 주기와 같은 5분이라 n8n 재시작
      # 등으로 틱이 한 번만 밀려도 그 교시 보고가 조용히 사라졌다. 이 창마저 넘긴
      # 교시는 포기하고 Slack으로 놓쳤다고 알린다.
      PERIOD_REPORT_CATCH_UP_MINUTES: "60"
    volumes:
      # **GPU 서버에 있던 워크플로는 따라오지 않는다.** 볼륨은 기계에 묶여 있고
      # project name도 달라졌다(classroom-monitoring-dev_n8n-data ->
      # classroom-monitoring-dev-pc_n8n-data). 옮기려면 편집기에서 워크플로와
      # 자격 증명을 export/import 하거나, 서버의 볼륨을 tar로 떠서 옮긴다.
      - n8n-data:/home/node/.n8n
      # 시간표 문서만 읽는다. 쓰기는 rpa-runner가 하므로 여기서는 읽기 전용이고,
      # RPA 디렉터리 전체가 아니라 시간표가 든 폴더 하나만 붙인다.
      - ../RPAs/study-status-report/schedule:/repo/RPAs/study-status-report/schedule:ro
    depends_on:
      - rpa-runner
    ports:
      - "127.0.0.1:15678:5678"
      - "100.119.241.93:15678:5678"
    networks:
      # fastapi와 같은 network에 둔다. n8n -> fastapi 호출은 경계를 넘지 않으므로
      # (결정 0026의 3번) 워크플로 안에서는 http://fastapi:8001 로 부르면 된다.
      - backend
    logging: *default-logging
    restart: unless-stopped

  rpa-runner:
    # **n8n 안에서 파이썬을 못 돌려서 생긴 서비스다.** n8n 2.33.5 공식 이미지에는
    # 파이썬이 없고 패키지 관리자(apk)까지 빠져 있어 Execute Command로 스크립트를
    # 부를 수 없다. 그래서 파이썬만 있는 작은 컨테이너를 두고, 워크플로는 이걸
    # HTTP Request 노드로 부른다(RPA_RUNNER_URL).
    build:
      context: ../RPAs/study-status-report/runner
      args:
        # **리눅스 호스트로 옮기면 여기를 채워야 한다.** 컨테이너는 root로 돌지
        # 않으면서 마운트된 저장소의 logs/·reports/에 쓴다. 컨테이너 UID가 그
        # 디렉터리 소유자와 다르면 쓰기가 막히고 보고서가 조용히 빠진다.
        #
        # 기본값 65534는 지금 이 PC에서 도는 값이다(nobody가 logs/·reports/를 만들어
        # 소유하고 있다). **바꾸면 기존 디렉터리 소유자도 함께 맞춰야 한다.** 리눅스
        # 호스트에서는 `id -u`/`id -g` 값을 셸 환경이나 .docker/.env에 두고,
        # `chown -R $(id -u):$(id -g) RPAs/study-status-report/{logs,reports}`를 한 번
        # 돌린다. 쓰기 가능 여부는 실행기의 `GET /health`가 알려 준다 — 못 쓰면 503이다.
        RUNNER_UID: "${RPA_RUNNER_UID:-65534}"
        RUNNER_GID: "${RPA_RUNNER_GID:-65534}"
    environment:
      REPO_DIR: /repo
    volumes:
      # 스크립트와 산출물이 모두 여기 있다. 보고서를 쓰므로 읽기 전용이 아니다.
      #
      # **Slack 토큰도 이 마운트로 들어온다.** scripts/slack_upload_file.py가
      # RPAs/study-status-report/.env를 읽는다 — 그 파일은 gitignore 대상이라
      # 저장소에 없고, 이 노트북에 직접 만들어 둬야 한다(RPA README 참고).
      - ../RPAs:/repo/RPAs
    # **호스트 포트로 내보내지 않는다.** 이 서비스는 스크립트를 실행하므로 n8n만
    # 부를 수 있으면 된다. 사설망이나 tailnet에 열 이유가 없다.
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped
