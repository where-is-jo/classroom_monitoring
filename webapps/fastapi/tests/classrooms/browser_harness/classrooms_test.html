<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>classrooms.js SSE contract test</title>
</head>
<body>
  <section data-classroom-dashboard data-classroom-id="classroom-a101">
    <p data-occupancy-count="total">1</p>
    <p data-occupancy-count="occupied">0</p>
    <p data-occupancy-count="vacant">0</p>
    <p data-occupancy-count="unknown">1</p>
  </section>
  <p>좌석 현황<span data-last-observed></span></p>
  <ul>
    <li class="seat-list-card seat-card--unknown" data-seat-id="seat-01" data-seat-state="unknown" data-assigned-student-id="student-01" data-student-state="unknown">
      <strong>좌석 1</strong>
      <dl>
        <div><dt>좌석 상태</dt><dd class="state-label">확인 필요</dd></div>
        <div><dt>학생 이름</dt><dd data-student-name>-</dd></div>
        <div><dt>학번</dt><dd data-student-no>-</dd></div>
        <div><dt>지정 좌석</dt><dd data-assigned-seat-label>-</dd></div>
        <div><dt>학생 상태</dt><dd><span class="state state--unknown" data-student-state><span data-student-state-icon>?</span><span data-student-state-label>확인 필요</span></span></dd></div>
        <div><dt>신뢰도</dt><dd data-student-confidence>-</dd></div>
        <div><dt>마지막 관측</dt><dd data-student-observed-at>-</dd></div>
      </dl>
    </li>
  </ul>
  <pre id="test-results"></pre>

  <script>
    window.__eventSources = [];
    window.__results = { checkpoints: [], done: false, error: null };

    window.fetch = function (url) {
      return Promise.resolve({
        ok: true,
        status: 200,
        json: function () {
          return Promise.resolve({
            classroom_id: "classroom-a101",
            states: [{
              student_id: "student-01",
              student_name: "초기 학생",
              student_no: "20260001",
              assigned_seat_id: "seat-01",
              assigned_seat_label: "좌석 1",
              current_state: "UNKNOWN",
              confidence: null,
              last_observed_at: "2026-08-15T07:29:00+00:00"
            }]
          });
        }
      });
    };

    function FakeEventSource(url) {
      this.url = String(url);
      this.listeners = {};
      this.closed = false;
      window.__eventSources.push(this);
    }

    FakeEventSource.prototype.addEventListener = function (type, handler) {
      (this.listeners[type] = this.listeners[type] || []).push(handler);
    };

    FakeEventSource.prototype.emit = function (type, data) {
      (this.listeners[type] || []).forEach(function (handler) {
        handler({ data: JSON.stringify(data) });
      });
    };

    FakeEventSource.prototype.emitRaw = function (type, data) {
      (this.listeners[type] || []).forEach(function (handler) {
        handler({ data: data });
      });
    };

    FakeEventSource.prototype.close = function () {
      this.closed = true;
    };

    window.EventSource = FakeEventSource;
  </script>
  <script src="{{ CLASSROOMS_JS_URI }}" defer></script>
  <script>
    (async function run() {
      var results = window.__results;

      function checkpoint(name, ok, detail) {
        results.checkpoints.push({ name: name, ok: !!ok, detail: String(detail || "") });
      }

      function tick() {
        return new Promise(function (resolve) { setTimeout(resolve, 50); });
      }

      try {
        await new Promise(function (resolve) {
          if (document.readyState === "interactive" || document.readyState === "complete") resolve();
          else document.addEventListener("DOMContentLoaded", resolve, { once: true });
        });
        await tick();

        var source = window.__eventSources.find(function (item) {
          return item.url.indexOf("/occupancy-events") !== -1;
        });
        var studentSource = window.__eventSources.find(function (item) {
          return item.url.indexOf("/student-state-events") !== -1;
        });
        checkpoint("subscribes-selected-classroom",
          window.__eventSources.length === 2 && source && studentSource,
          window.__eventSources.map(function (item) { return item.url; }).join(","));
        checkpoint("initial-rest-state-applied",
          document.querySelector("[data-student-name]").textContent === "초기 학생" &&
          document.querySelector("[data-student-observed-at]").textContent !== "-",
          document.querySelector('[data-assigned-student-id="student-01"]').outerHTML);

        source.emit("occupancy", {
          seat_id: "seat-01",
          state: "OCCUPIED",
          confidence: 0.91,
          observed_at: "2026-08-15T07:30:00+00:00"
        });
        await tick();

        var seat = document.querySelector('[data-seat-id="seat-01"]');
        checkpoint("list-card-state-updates",
          seat.classList.contains("seat-list-card") &&
          seat.classList.contains("seat-card--occupied") &&
          seat.dataset.seatState === "occupied" &&
          seat.querySelector(".state-label").textContent === "재석",
          seat.outerHTML);
        checkpoint("summary-counts-update",
          document.querySelector('[data-occupancy-count="occupied"]').textContent === "1" &&
          document.querySelector('[data-occupancy-count="unknown"]').textContent === "0" &&
          document.querySelector('[data-occupancy-count="total"]').textContent === "1",
          document.querySelector("[data-classroom-id]").textContent);
        checkpoint("last-observed-updates",
          document.querySelector("[data-last-observed]").textContent.indexOf("마지막 관측") !== -1,
          document.querySelector("[data-last-observed]").textContent);

        studentSource.emit("student-state", {
          student_id: "student-01",
          student_name: "김로운",
          student_no: "20260001",
          assigned_seat_id: "seat-01",
          assigned_seat_label: "좌석 S01",
          current_state: "PRESENT",
          confidence: 0.91,
          observed_at: "2026-08-15T07:30:00+00:00"
        });
        await tick();
        checkpoint("student-present-updates",
          document.querySelector("[data-student-state-label]").textContent === "재석" &&
          document.querySelector("[data-student-confidence]").textContent === "91%" &&
          document.querySelector("[data-student-name]").textContent === "김로운" &&
          document.querySelector("[data-assigned-seat-label]").textContent === "좌석 S01",
          document.querySelector('[data-assigned-student-id="student-01"]').outerHTML);

        studentSource.emit("student-state", {
          student_id: "student-01",
          current_state: "WRONG_SEAT",
          confidence: 0.82,
          observed_at: "2026-08-15T07:31:00+00:00"
        });
        await tick();
        checkpoint("student-wrong-seat-updates",
          document.querySelector("[data-student-state-label]").textContent === "잘못된 자리",
          document.querySelector("[data-student-state-label]").textContent);

        studentSource.emitRaw("student-state", "{malformed");
        studentSource.emit("student-state", {
          student_id: "student-01",
          current_state: "UNKNOWN",
          confidence: null,
          observed_at: null
        });
        await tick();
        checkpoint("malformed-ignored-and-unknown-updates",
          document.querySelector("[data-student-state-label]").textContent === "확인 필요" &&
          document.querySelector("[data-student-confidence]").textContent === "-" &&
          document.querySelector("[data-student-observed-at]").textContent === "-",
          document.querySelector('[data-assigned-student-id="student-01"]').outerHTML);

        source.emit("occupancy", {
          seat_id: "seat-01",
          state: "VACANT",
          confidence: 0.9,
          observed_at: "2026-08-15T07:32:00+00:00"
        });
        await tick();
        checkpoint("vacant-is-not-student-absent",
          document.querySelector(".state-label").textContent === "부재" &&
          document.querySelector("[data-student-state-label]").textContent === "확인 필요",
          document.body.textContent);

        if (studentSource.onerror) studentSource.onerror();
        checkpoint("eventsource-reconnect-remains-open", !studentSource.closed,
          "closed=" + studentSource.closed);

        window.dispatchEvent(new Event("beforeunload"));
        checkpoint("unload-closes-event-source",
          window.__eventSources.every(function (item) { return item.closed; }),
          window.__eventSources.map(function (item) { return item.closed; }).join(","));
        results.done = true;
      } catch (error) {
        results.error = String((error && error.stack) || error);
        checkpoint("harness-error", false, results.error);
      }

      document.getElementById("test-results").textContent = JSON.stringify(results);
    })();
  </script>
</body>
</html>
