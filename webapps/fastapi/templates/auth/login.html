{% extends "base.html" %}

{% block title %}로그인 · 스마트 오피스 모니터링{% endblock %}

{% block content %}
  <section class="auth-card" aria-labelledby="login-title">
    <h1 id="login-title">로그인</h1>
    <p class="summary">관리자가 발급한 가상 계정의 이메일과 비밀번호를 입력하세요.</p>

    {% if error %}
      <div class="alert alert--error" role="alert"{% if locked %} data-account-locked="true"{% endif %}>
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/login" class="stack" data-submit-state>
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        이메일
        <input name="email" type="email" autocomplete="username" required maxlength="254">
      </label>
      <label>
        비밀번호
        <input name="password" type="password" autocomplete="current-password" required maxlength="128">
      </label>
      <button type="submit" data-pending-label="로그인 중…">로그인</button>
      <p class="form-pending" aria-live="polite" hidden>로그인 요청을 처리하고 있습니다.</p>
    </form>
  </section>
{% endblock %}
