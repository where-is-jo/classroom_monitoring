<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00685f">
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <title>{% block title %}학습 모니터링{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  <script src="{{ url_for('static', path='/forms.js') }}" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="app-body">
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  {% set current_path = request.url.path %}
  <div class="app-shell">
    <aside class="sidebar" aria-label="주 탐색">
      <div class="sidebar-brand">
        <a class="brand" href="/classrooms" aria-label="학습 모니터링 홈">
          <span class="brand-mark" aria-hidden="true">▦</span>
          <span><strong>학습 모니터링</strong><small>강의실 운영</small></span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
          <span class="nav-toggle-icon" aria-hidden="true"></span><span class="nav-toggle-label">메뉴</span>
        </button>
      </div>
      <nav id="primary-navigation" class="side-nav">
        <div class="nav-group">
          <p class="nav-group-title">모니터링</p>
          <a href="/classrooms"{% if current_path == '/classrooms' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">▦</span><span>강의실 좌석 현황</span></a>
          <a href="/monitoring"{% if current_path == '/monitoring' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">▣</span><span>실시간 모니터링</span></a>
          <a href="/snapshots"{% if current_path == '/snapshots' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">◫</span><span>탐지 스냅샷</span></a>
          <a href="/video-search"{% if current_path == '/video-search' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">⌕</span><span>자연어 검색</span></a>
        </div>
        <div class="nav-group nav-group-spaced">
          <p class="nav-group-title">등록 관리</p>
          <a href="/students/new"{% if current_path == '/students/new' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">＋</span><span>학생 등록</span></a>
          <a href="/students/demo-student/face-enrollment"{% if '/face-enrollment' in current_path %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">◎</span><span>얼굴 등록</span></a>
        </div>
      </nav>
    </aside>
    <div class="workspace">
      <main id="main-content" class="content" tabindex="-1">{% block content %}{% endblock %}</main>
      <footer class="site-footer"><p>상태 시각과 데이터 출처를 확인한 뒤 판단하세요.</p></footer>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
