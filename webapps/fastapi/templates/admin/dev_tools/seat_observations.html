<section class="panel" aria-labelledby="seat-observation-title">
  <p class="eyebrow">개발 전용</p>
  <h2 id="seat-observation-title">좌석 mock 점유 batch</h2>
  <p class="muted">이미지나 카메라 정보 없이 좌석별 boolean과 confidence만 입력합니다.</p>
  <form method="post" action="/admin/dev-tools/seat-observations" class="form-grid" data-submit-state>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>event_id<input name="event_id" value="{{ event_id }}" required></label>
    <label>classroom_id<input name="classroom_id" required></label>
    <label>observed_at (ISO 8601 UTC)<input name="observed_at" value="{{ observed_at }}" required></label>
    <label>좌석 입력 (한 줄에 seat_id,true|false,confidence)
      <textarea name="seat_lines" rows="5" required placeholder="seat-uuid,true,0.9"></textarea>
    </label>
    <button type="submit" data-pending-label="반영 중…">좌석 mock 관측 반영</button>
  </form>
</section>
