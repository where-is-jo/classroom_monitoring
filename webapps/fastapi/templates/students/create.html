{% extends "base.html" %}

{% block title %}학생 등록 · 학습 모니터링{% endblock %}

{% block content %}
  <header class="page-header">
    <div>
      <p class="eyebrow">학생</p>
      <h1>학생 등록</h1>
      <p class="summary">새로운 학생을 등록합니다.</p>
    </div>
    <a class="button-link secondary" href="/students">목록</a>
  </header>

  <section class="panel" aria-labelledby="student-form-title">
    <h2 id="student-form-title">학생 정보</h2>
    <form class="stack" data-api-url="/api/v1/students" data-api-method="POST" data-success-url="/students">
      <p class="form-error" role="alert" data-form-error hidden></p>
      <div class="form-grid">
        <label>학번<input name="student_no" type="text" maxlength="64" required autocomplete="off" placeholder="20240001"></label>
        <label>이름<input name="name" type="text" maxlength="200" required placeholder="김철수"></label>
        <label>소속<input name="department" type="text" maxlength="200" required placeholder="컴퓨터공학과"></label>
      </div>
      <div>
        <button type="submit">등록</button>
        <a class="button-link secondary" href="/students">취소</a>
      </div>
    </form>
  </section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/students.js') }}" defer></script>
{% endblock %}
