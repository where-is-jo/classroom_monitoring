{% extends "base.html" %}

{% block title %}학생 수정 · 학습 모니터링{% endblock %}

{% block content %}
  <header class="page-header">
    <div>
      <p class="eyebrow">학생</p>
      <h1>{{ student.name }} 수정</h1>
      <p class="summary">{{ student.student_no }} · {{ student.department }}</p>
    </div>
    <a class="button-link secondary" href="/students">목록</a>
  </header>

  <section class="panel" aria-labelledby="student-form-title">
    <h2 id="student-form-title">학생 정보</h2>
    <form class="stack" data-api-url="/api/v1/students/{{ student.id }}" data-api-method="PATCH" data-success-url="/students">
      <p class="form-error" role="alert" data-form-error hidden></p>
      <div class="form-grid">
        <label>이름<input name="name" type="text" maxlength="200" required value="{{ student.name }}"></label>
        <label>소속<input name="department" type="text" maxlength="200" required value="{{ student.department }}"></label>
        <label>활성화<input name="is_active" type="checkbox"{% if student.is_active %} checked{% endif %}></label>
      </div>
      <div>
        <button type="submit">저장</button>
        <a class="button-link secondary" href="/students">취소</a>
      </div>
    </form>
  </section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/students.js') }}" defer></script>
{% endblock %}
