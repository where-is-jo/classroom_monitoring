apiVersion: 1

# uid 없이 먼저 provisioning된 적이 있으면 Grafana가 자동 생성한 uid로 저장돼 있어서,
# 아래 uid를 붙인 정의로 갱신할 때 "data source not found"로 기동이 실패한다.
# 이름 기준으로 먼저 지우고 다시 만들어 uid를 확정한다.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # 대시보드 JSON이 이 uid로 데이터소스를 참조한다. 바꾸면 대시보드도 함께 고쳐야 한다.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
