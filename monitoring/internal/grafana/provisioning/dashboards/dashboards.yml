apiVersion: 1

# 대시보드는 Grafana UI에서 만들고 끝내지 않고 JSON 파일로 관리한다
# (monitoring/internal/README.md "Grafana 대시보드 정의(가능하면 코드로 관리)").
# UI에서 고친 내용은 컨테이너를 다시 만들면 사라지므로, 바꿨으면 JSON으로 export해
# monitoring/internal/grafana/dashboards/ 아래 파일을 갱신해야 한다.
providers:
  - name: classroom-monitoring
    orgId: 1
    folder: Classroom Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # compose가 monitoring/internal/grafana/dashboards를 이 경로에 마운트한다.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
