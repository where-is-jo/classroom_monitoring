name: AdaFace 모델 배치

# 모델 가중치는 저장소와 일반 compose 배포에 포함하지 않는다. 선택 모델 파일이 서버에서
# 유실된 경우에만 사람이 실행해, 고정된 공식 revision에서 산출물을 다시 만들고 배치한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-adaface-model
  cancel-in-progress: false

env:
  MODEL_SHA256_ALLOWLIST: 7baabf47c06391ab52e312134c6255846a5e55aa5a641f0553a89092fe2429d8 7cb549232dd13071d9a12cd74cb9fa9741c9087021c1e6f1ae5ed994b5af7cfc
  MODEL_RELATIVE_PATH: .docker/models/face/adaface/adaface_ir50_webface4m.onnx

jobs:
  provision:
    name: 고정 AdaFace ONNX 검증·배치
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키와 호스트 키 준비
        env:
          HOST: ${{ secrets.GPU_SERVER_HOST }}
          PORT: ${{ secrets.GPU_SERVER_PORT }}
          USER_NAME: ${{ secrets.GPU_SERVER_USER }}
          SSH_KEY: ${{ secrets.GPU_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GPU_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$HOST" ] || missing="$missing GPU_SERVER_HOST"
          [ -n "$USER_NAME" ] || missing="$missing GPU_SERVER_USER"
          [ -n "$SSH_KEY" ] || missing="$missing GPU_SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::저장소 시크릿이 없다:$missing"
            exit 1
          fi

          port="${PORT:-2222}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/gpu_deploy_key"
          chmod 600 "$HOME/.ssh/gpu_deploy_key"
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$port" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || :
            if [ ! -s "$HOME/.ssh/known_hosts" ]; then
              echo "::error::GPU 서버의 SSH 호스트 키를 받지 못했다."
              exit 1
            fi
            echo "::warning::GPU_SERVER_KNOWN_HOSTS가 없어 현재 호스트 키를 TOFU로 신뢰했다."
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh_opts="-i $HOME/.ssh/gpu_deploy_key -p $port -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          echo "SSH_OPTS=$ssh_opts" >> "$GITHUB_ENV"
          echo "TARGET=$USER_NAME@$HOST" >> "$GITHUB_ENV"

      - name: 서버 대상 경로와 기존 산출물 확인
        id: remote
        env:
          DEPLOY_PATH: ${{ vars.GPU_SERVER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          deploy_path="${DEPLOY_PATH:-~/classroom-monitoring}"
          if ! remote_path=$(ssh $SSH_OPTS "$TARGET" "cd $deploy_path && pwd"); then
            echo "::error::GPU 서버 배포 경로($deploy_path)에 접근하지 못했다."
            exit 1
          fi
          echo "REMOTE_PATH=$remote_path" >> "$GITHUB_ENV"

          state=$(ssh $SSH_OPTS "$TARGET" \
            "REMOTE_PATH='$remote_path' MODEL_RELATIVE_PATH='$MODEL_RELATIVE_PATH' MODEL_SHA256_ALLOWLIST='$MODEL_SHA256_ALLOWLIST' bash -s" <<'REMOTE'
          set -euo pipefail
          destination="$REMOTE_PATH/$MODEL_RELATIVE_PATH"
          if [ ! -f "$destination" ]; then
            echo missing
            exit 0
          fi
          actual=$(sha256sum "$destination" | awk '{print $1}')
          case " $MODEL_SHA256_ALLOWLIST " in
            *" $actual "*) echo valid ;;
            *) echo invalid ;;
          esac
          REMOTE
          )
          echo "기존 서버 산출물 상태: $state"
          if [ "$state" = valid ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.remote.outputs.needed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deeplearning/training/requirements-adaface-export.txt

      - name: 고정 revision에서 AdaFace ONNX 생성
        if: steps.remote.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python -m pip install -r deeplearning/training/requirements-adaface-export.txt
          output="$RUNNER_TEMP/adaface_ir50_webface4m.onnx"
          source_dir="$RUNNER_TEMP/cvlface_ir50_webface4m"
          python -m deeplearning.training.prepare_adaface_model \
            --source-dir "$source_dir" \
            --output "$output"
          model_sha256=$(sha256sum "$output" | awk '{print $1}')
          case " $MODEL_SHA256_ALLOWLIST " in
            *" $model_sha256 "*) ;;
            *) echo "::error::생성된 AdaFace ONNX가 검증된 SHA-256 목록에 없다."; exit 1 ;;
          esac
          echo "MODEL_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "MODEL_SHA256=$model_sha256" >> "$GITHUB_ENV"

      - name: 검증된 모델을 서버에 원자적으로 배치
        if: steps.remote.outputs.needed == 'true'
        run: |
          set -euo pipefail
          remote_dir="$REMOTE_PATH/.docker/models/face/adaface"
          remote_temp="$remote_dir/.adaface_ir50_webface4m.onnx.$GITHUB_RUN_ID.tmp"
          ssh $SSH_OPTS "$TARGET" "mkdir -p '$remote_dir'"
          rsync -lt --no-owner --no-group \
            -e "ssh $SSH_OPTS" \
            "$MODEL_OUTPUT" "$TARGET:$remote_temp"

          ssh $SSH_OPTS "$TARGET" \
            "REMOTE_PATH='$REMOTE_PATH' MODEL_RELATIVE_PATH='$MODEL_RELATIVE_PATH' MODEL_SHA256='$MODEL_SHA256' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          destination="$REMOTE_PATH/$MODEL_RELATIVE_PATH"
          directory=$(dirname "$destination")
          temporary="$directory/.adaface_ir50_webface4m.onnx.$RUN_ID.tmp"
          backup="$destination.invalid-$RUN_ID"
          trap 'rm -f -- "$temporary"' EXIT

          actual=$(sha256sum "$temporary" | awk '{print $1}')
          if [ "$actual" != "$MODEL_SHA256" ]; then
            echo "전송된 AdaFace ONNX SHA-256이 계약값과 다릅니다." >&2
            exit 1
          fi
          chmod 0644 "$temporary"
          if [ -e "$destination" ]; then
            mv -- "$destination" "$backup"
            echo "기존 비정상 산출물을 보존했습니다: $(basename "$backup")"
          fi
          if ! mv -- "$temporary" "$destination"; then
            [ ! -e "$backup" ] || mv -- "$backup" "$destination"
            exit 1
          fi

          final=$(sha256sum "$destination" | awk '{print $1}')
          if [ "$final" != "$MODEL_SHA256" ]; then
            rm -f -- "$destination"
            [ ! -e "$backup" ] || mv -- "$backup" "$destination"
            echo "배치된 AdaFace ONNX의 최종 SHA-256 검증에 실패했습니다." >&2
            exit 1
          fi
          echo "AdaFace ONNX 배치 완료: $MODEL_RELATIVE_PATH"
          REMOTE

      - name: 이미 올바른 모델이면 변경하지 않는다
        if: steps.remote.outputs.needed != 'true'
        run: echo "계약 SHA-256과 일치하는 AdaFace ONNX가 이미 있어 서버를 변경하지 않았다."
