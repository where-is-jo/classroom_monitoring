name: CI

# 결정 0014(docs/architecture/decisions.md)를 따른다.
# 문서 전용 변경은 fastapi/worker job이 스킵되어 필수 체크가 즉시 통과한다.
# paths-ignore로 워크플로우 자체를 막지 않는다 — 트리거되지 않은 필수 체크는
# 영원히 "대기 중"으로 남아 오히려 병합을 막는다.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경 범위 판정
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fastapi: ${{ steps.filter.outputs.fastapi }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fastapi:
              - 'webapps/fastapi/**'
            worker:
              - 'worker/**'

  fastapi-checks:
    name: fastapi 린트·타입·테스트
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapps/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webapps/fastapi/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m mypy app tests
      - run: python -m pytest -q

  worker-checks:
    name: worker 테스트
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            worker/pipeline/requirements.txt
            worker/stream/requirements.txt
            worker/inference/requirements.txt
            worker/recorder/requirements.txt
      # pipeline/requirements.txt가 stream·inference 의존성을 -r로 묶어온다.
      # recorder는 별도 파일이라 명시적으로 더해야 전체 테스트가 돈다.
      - run: python -m pip install -r pipeline/requirements.txt -r recorder/requirements.txt
      - run: python -m pytest -q

  build-push-fastapi:
    name: fastapi 이미지 빌드·업로드
    needs: [changes, fastapi-checks]
    if: github.event_name == 'push' && needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/classroom-monitoring-fastapi
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./webapps/fastapi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fastapi
          cache-to: type=gha,mode=max,scope=fastapi

  build-push-worker:
    name: worker 이미지 빌드·업로드
    needs: [changes, worker-checks]
    if: github.event_name == 'push' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/classroom-monitoring-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
