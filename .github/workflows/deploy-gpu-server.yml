name: GPU 서버 배포

# 서버에 올라가는 docker compose·수집 설정을 저장소 상태로 맞춘다.
# 지금까지는 .docker/*.yml을 고칠 때마다 사람이 SSH로 붙어 파일을 옮기고 up -d를
# 다시 쳤다. 그 과정이 빠지면 서버와 저장소가 조용히 어긋난다.
#
# 배포 대상은 커밋되는 파일뿐이다. .docker/env/(비밀값)와 .docker/models/(가중치)는
# 저장소에 없고 서버 로컬에만 있으므로 이 워크플로우는 그 둘을 절대 건드리지 않는다
# (결정 0018).
#
# 여기서는 paths 필터를 써도 안전하다. ci.yml이 paths-ignore를 피한 이유는 필수 상태
# 체크가 "대기 중"으로 남는 함정 때문인데, 이 워크플로우는 필수 체크가 아니다.

on:
  push:
    branches: [develop]
    paths:
      - '.docker/**'
      - '!.docker/**/*.md'
      - '.github/workflows/deploy-gpu-server.yml'
  workflow_dispatch:

permissions:
  contents: read

# 서버는 하나뿐이라 배포를 전역으로 직렬화한다. 진행 중인 배포를 취소하면
# 파일만 올라가고 up -d를 못 한 중간 상태로 남을 수 있어 취소하지 않는다.
concurrency:
  group: deploy-gpu-server
  cancel-in-progress: false

env:
  # 이 서버에서 돌리는 스택만 검증하고 재적용한다. compose.main.dev.pc.yml과
  # compose.publisher.dev.pc.yml은 개인 PC 쪽 절반이라(결정 0026) 여기서 실행하지
  # 않는다. 파일 자체는 서버로 함께 올라가지만 검증 대상이 아니다 — 그 둘이 참조하는
  # env 파일이 이 서버에는 없어서 config 단계에서 실패한다.
  SERVER_STACKS: compose.main.dev.gpu.yml compose.llm.dev.yml compose.monitoring.dev.yml

jobs:
  reachability:
    name: GPU 서버 생존 확인
    runs-on: ubuntu-latest
    outputs:
      alive: ${{ steps.probe.outputs.alive }}
    steps:
      # 접속 정보가 없는 것은 "서버가 꺼짐"과 다르다. 설정 누락을 조용히 넘기면
      # 배포가 영원히 스킵되는데도 워크플로우는 계속 초록불이 된다.
      - name: 배포 시크릿이 설정되어 있는지 확인
        env:
          HOST: ${{ secrets.GPU_SERVER_HOST }}
          USER_NAME: ${{ secrets.GPU_SERVER_USER }}
          SSH_KEY: ${{ secrets.GPU_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$HOST" ] || missing="$missing GPU_SERVER_HOST"
          [ -n "$USER_NAME" ] || missing="$missing GPU_SERVER_USER"
          [ -n "$SSH_KEY" ] || missing="$missing GPU_SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::저장소 시크릿이 없다:$missing"
            echo "Settings → Secrets and variables → Actions에서 등록한다." >&2
            exit 1
          fi

      # SSH 포트에 TCP로 붙어 본다. 여기서 실패하면 서버가 꺼졌거나 네트워크가 끊긴
      # 것으로 보고 배포를 건너뛴다 — job을 실패시키지 않는다. 공용 GPU 서버는
      # 우리가 전원을 통제하지 않으므로 꺼져 있는 것은 장애가 아니라 정상 상태다.
      # 인증·권한 문제는 아래 deploy job에서 따로 걸러 실패로 알린다.
      - name: SSH 포트 도달성 확인
        id: probe
        env:
          HOST: ${{ secrets.GPU_SERVER_HOST }}
          PORT: ${{ secrets.GPU_SERVER_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-2222}"
          alive=false
          # 한 번의 패킷 손실로 배포를 통째로 거르지 않도록 세 번까지 본다.
          for attempt in 1 2 3; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$port" 2>/dev/null; then
              alive=true
              echo "시도 $attempt: 연결됨"
              break
            fi
            echo "시도 $attempt: 응답 없음"
            [ "$attempt" -eq 3 ] || sleep 10
          done
          echo "alive=$alive" >> "$GITHUB_OUTPUT"

      - name: 서버가 꺼져 있으면 이유를 남긴다
        if: steps.probe.outputs.alive != 'true'
        run: |
          set -euo pipefail
          echo "::notice::GPU 서버의 SSH 포트에 닿지 못해 배포를 건너뛴다. 실패가 아니다."
          {
            echo "## 배포를 건너뛰었다"
            echo
            echo "GPU 서버의 SSH 포트에 닿지 못했다. 서버가 꺼져 있거나 네트워크가 끊긴 상태로 본다."
            echo
            echo "저장소의 \`.docker/\` 는 서버에 **반영되지 않았다.** 서버를 켠 뒤"
            echo "Actions 탭에서 이 워크플로우를 \`Run workflow\` 로 다시 돌린다."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: compose 설정 배포
    needs: reachability
    if: needs.reachability.outputs.alive == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키와 호스트 키 준비
        env:
          HOST: ${{ secrets.GPU_SERVER_HOST }}
          PORT: ${{ secrets.GPU_SERVER_PORT }}
          SSH_KEY: ${{ secrets.GPU_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GPU_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${PORT:-2222}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/gpu_deploy_key"
          chmod 600 "$HOME/.ssh/gpu_deploy_key"

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            # 호스트 키를 그 자리에서 받아 신뢰한다(TOFU). 중간자 공격을 막지 못하므로
            # GPU_SERVER_KNOWN_HOSTS 시크릿에 서버 호스트 키를 넣어 두는 편이 낫다.
            ssh-keyscan -p "$port" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || :
            if [ ! -s "$HOME/.ssh/known_hosts" ]; then
              echo "::error::ssh-keyscan이 호스트 키를 받지 못했다. SSH 포트는 열려 있으나 sshd가 응답하지 않는 상태로 보인다."
              exit 1
            fi
            echo "::warning::GPU_SERVER_KNOWN_HOSTS가 없어 ssh-keyscan 결과를 그대로 신뢰했다. 서버에서 ssh-keyscan 결과를 시크릿에 등록하면 이 경고가 사라진다."
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      # 포트가 열렸다고 배포할 수 있는 것은 아니다. 키 인증·배포 경로·필요한 도구를
      # 파일을 옮기기 전에 확인한다. 여기서 실패하면 설정 문제이므로 job을 실패시킨다.
      - name: 접속과 배포 전제 확인
        env:
          HOST: ${{ secrets.GPU_SERVER_HOST }}
          PORT: ${{ secrets.GPU_SERVER_PORT }}
          USER_NAME: ${{ secrets.GPU_SERVER_USER }}
          DEPLOY_PATH: ${{ vars.GPU_SERVER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${PORT:-2222}"
          deploy_path="${DEPLOY_PATH:-~/classroom-monitoring}"
          ssh_opts="-i $HOME/.ssh/gpu_deploy_key -p $port -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
          echo "SSH_OPTS=$ssh_opts" >> "$GITHUB_ENV"
          echo "TARGET=$USER_NAME@$HOST" >> "$GITHUB_ENV"

          # 배포 경로의 ~ 를 서버 셸이 풀게 하고 절대 경로로 고정한다.
          # rsync 원격 경로에 ~ 를 그대로 넘기면 확장 시점이 애매해진다.
          if ! remote_path=$(ssh $ssh_opts "$USER_NAME@$HOST" "cd $deploy_path && pwd"); then
            echo "::error::배포 경로($deploy_path)로 이동하지 못했다. 키 인증에 실패했거나 경로가 없다. 경로는 저장소 변수 GPU_SERVER_DEPLOY_PATH로 지정한다."
            exit 1
          fi
          echo "REMOTE_PATH=$remote_path" >> "$GITHUB_ENV"
          echo "배포 경로: $remote_path"

          if ! ssh $ssh_opts "$USER_NAME@$HOST" 'command -v rsync >/dev/null'; then
            echo "::error::서버에 rsync가 없다. sudo apt-get install -y rsync 로 설치한다."
            exit 1
          fi
          if ! ssh $ssh_opts "$USER_NAME@$HOST" 'docker compose version >/dev/null'; then
            echo "::error::서버에서 docker compose 를 실행하지 못했다. 도커 설치나 계정 권한(docker 그룹)을 확인한다."
            exit 1
          fi

      # 문법이 깨진 파일을 서버에 올리는 것 자체를 막는다. 서버에는 .docker/env/가
      # 있지만 러너에는 없으므로, compose가 참조하는 env 파일을 빈 파일로 만들어
      # 검증한다. 값이 아니라 YAML 구조를 보는 검사다 — 값 검증은 서버에서 다시 한다.
      - name: 러너에서 compose 문법 사전 검증
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -r .docker "$tmp/.docker"
          cd "$tmp"
          mkdir -p .docker/models
          # grep 은 매치가 0건이면 exit 1 이라 pipefail 아래에서 스텝을 실패시킨다.
          # env_file 참조가 없는 구성도 정상이므로 그 경우를 실패로 보지 않는다.
          { grep -ho '\./env/[A-Za-z0-9._-]*\.env' .docker/*.yml || :; } | sed 's|^\./|.docker/|' | sort -u \
            | while read -r p; do mkdir -p "$(dirname "$p")"; : > "$p"; done
          for stack in $SERVER_STACKS; do
            echo "검증: $stack"
            docker compose -f ".docker/$stack" config --quiet
          done

      # 검증이 실패하면 되돌릴 수 있어야 한다. models/(5GB대 가중치)와 env/(비밀값)는
      # 우리가 건드리지 않으므로 백업에서도 뺀다.
      - name: 서버의 현재 .docker 백업
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"
          ssh $SSH_OPTS "$TARGET" "REMOTE_PATH='$REMOTE_PATH' STAMP='$stamp' bash -s" <<'REMOTE'
          set -euo pipefail
          backup_dir="$REMOTE_PATH/.deploy-backups"
          mkdir -p "$backup_dir"
          tar czf "$backup_dir/$STAMP.tar.gz" -C "$REMOTE_PATH" \
            --exclude='.docker/models' --exclude='.docker/env' .docker
          echo "백업: $backup_dir/$STAMP.tar.gz"
          # 오래된 백업은 정리한다. 디스크를 공용으로 쓰는 서버다.
          { ls -1t "$backup_dir"/*.tar.gz 2>/dev/null || :; } | tail -n +11 | xargs -r rm -f
          REMOTE

      # git이 추적하는 파일만 목록으로 넘긴다. --delete를 쓰지 않는 이유가 여기 있다 —
      # 서버에만 있는 env/·models/·data/를 지울 위험을 아예 만들지 않는다.
      # 저장소에서 파일을 지웠을 때 서버에서도 지우는 일은 사람이 판단해서 한다.
      - name: 커밋된 .docker 파일 전송
        run: |
          set -euo pipefail
          git ls-files -z .docker \
            | rsync -rlt --no-owner --no-group --from0 --files-from=- \
                --itemize-changes \
                -e "ssh $SSH_OPTS" \
                ./ "$TARGET:$REMOTE_PATH/" | tee /tmp/rsync.log

      # 서버의 실제 env 값까지 포함한 검증이다. 실패하면 방금 올린 파일을 백업으로
      # 되돌린 뒤 job을 실패시킨다. 깨진 설정을 서버에 남겨 두지 않는다.
      - name: 서버에서 compose 검증 (실패 시 롤백)
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$TARGET" "REMOTE_PATH='$REMOTE_PATH' STAMP='$BACKUP_STAMP' STACKS='$SERVER_STACKS' bash -s" <<'REMOTE'
          set -uo pipefail
          cd "$REMOTE_PATH"
          failed=""
          for stack in $STACKS; do
            if ! docker compose -f ".docker/$stack" config --quiet; then
              failed="$failed $stack"
            fi
          done
          if ! python3 .docker/scripts/validate_face_handover_deployment.py; then
            failed="$failed face-handover-inputs"
          fi
          if [ -n "$failed" ]; then
            echo "검증 실패:$failed — 백업으로 되돌린다" >&2
            tar xzf "$REMOTE_PATH/.deploy-backups/$STAMP.tar.gz" -C "$REMOTE_PATH"
            echo "롤백 완료" >&2
            exit 1
          fi
          echo "세 스택 모두 검증 통과"
          REMOTE

      # 떠 있는 스택만 다시 올린다. 내려 둔 스택을 CI가 마음대로 켜지 않는다 —
      # 모니터링 스택은 MVP에서 일부러 띄우지 않고 있다(.docker/README.server.md).
      # 그 스택의 파일은 이미 갱신됐으므로 사람이 다음에 up 할 때 반영된다.
      # 순서는 main.gpu 먼저다. 그 스택이 backend network를 만들고 나머지 둘이
      # external로 참조한다.
      - name: 떠 있는 스택 재적용
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$TARGET" "REMOTE_PATH='$REMOTE_PATH' STACKS='$SERVER_STACKS' bash -s" <<'REMOTE' | tee /tmp/apply.log
          set -euo pipefail
          cd "$REMOTE_PATH"
          for stack in $STACKS; do
            if [ -n "$(docker compose -f ".docker/$stack" ps -q)" ]; then
              echo "== $stack: up -d"
              docker compose -f ".docker/$stack" up -d
              docker compose -f ".docker/$stack" ps
            else
              echo "== $stack: 실행 중인 컨테이너가 없어 건너뛴다"
            fi
          done
          REMOTE

      - name: 결과 요약
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## GPU 서버 배포"
            echo
            echo "- 배포 경로: \`${REMOTE_PATH:-미확인}\`"
            echo "- 백업: \`${REMOTE_PATH:-?}/.deploy-backups/${BACKUP_STAMP:-없음}.tar.gz\`"
            echo
            echo "### 전송된 파일"
            echo '```'
            cat /tmp/rsync.log 2>/dev/null || echo "(전송 단계에 이르지 못했다)"
            echo '```'
            echo
            echo "### 스택 재적용"
            echo '```'
            cat /tmp/apply.log 2>/dev/null || echo "(재적용 단계에 이르지 못했다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
